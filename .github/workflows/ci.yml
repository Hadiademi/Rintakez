# CI gates on every push/PR to main: typecheck, lint, unit tests (which
# include the de/fr/en i18n-parity suite) and a production build. These mirror
# the local "gates before done" in CLAUDE.md, so a push that would break the
# auto-deploy fails HERE first.
#
# Deliberately phase 1: no pgTAP (needs a local Supabase stack) and no
# Playwright e2e — both stay local for now; add them as a second job when they
# earn their CI minutes.
#
# The build needs no real secrets: Supabase URLs/keys are read at request time
# in prod, so dummy values satisfy the build-time inlining (verified locally
# by building with exactly these values).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      NEXT_PUBLIC_SITE_URL: https://framly.ch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (incl. i18n parity)
        run: npx vitest run

      - name: Build
        run: npm run build
