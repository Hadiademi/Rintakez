version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk patch/minor bumps into a single PR to cut review noise.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Major upgrades (TypeScript, ESLint, @types/node beyond the Node runtime…)
    # change behaviour and are planned work, not weekly PRs that sit red for
    # months. Security fixes still arrive via Dependabot security updates and
    # the `npm audit` gate in CI.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
